# .streamlit/config.toml
# Colours and font for the whole app. Safe to upload to GitHub (no secrets here).

[theme]
base = "dark"
primaryColor = "#5B9BD5"            # light blue (main accent)
backgroundColor = "#0D1620"         # page background (very dark blue)
secondaryBackgroundColor = "#15222E"
textColor = "#E6EEF5"               # soft white text
font = "sans serif"
