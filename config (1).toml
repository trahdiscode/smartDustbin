# .streamlit/config.toml
# Colours and font for the whole app. Safe to upload to GitHub (no secrets here).

[theme]
base = "light"
primaryColor = "#12355B"            # navy (main accent)
backgroundColor = "#F4F6F9"         # page background (light grey-blue)
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2A3A"               # dark blue-grey text
font = "sans serif"
